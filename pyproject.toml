[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-eval"
version = "0.1.0"
description = "Self-correcting Agentic RAG (LangGraph + Qdrant hybrid retrieval) with a measured eval harness"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "qdrant-client>=1.11",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pypdf>=4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
